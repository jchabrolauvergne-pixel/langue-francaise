<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes quiz de français</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap">
<style>
:root{--paper:#f4f6fb;--card:#fff;--ink:#18264a;--muted:#5b6788;--line:#d8deec;--blue:#2b54c9;--hl:#ffe46b;--chip:#e4ebfc}
@media (prefers-color-scheme:dark){:root{--paper:#111827;--card:#1a2336;--ink:#e7ecf8;--muted:#9aa6c4;--line:#2e3a55;--blue:#7d9cf5;--hl:#8a7419;--chip:#24325a}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;padding:24px 16px 48px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1.1;margin:0 0 .3rem}
h1 span{background:var(--hl);padding:0 .15em;border-radius:4px}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--blue);transform:translateY(-2px);outline:none}
.card h2{margin:0;font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.93rem;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);color:var(--ink);font-size:.8rem;padding:2px 10px;border-radius:999px}
.msg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Mes quiz de <span>français</span></h1>
  <p class="sub">Choisis un quiz.</p>
  <div class="grid" id="grid"><p class="msg">Chargement des quiz…</p></div>
</div>
<script>
/* Liste automatique : cette page demande à GitHub la liste des fichiers .html
   du dépôt et affiche chaque quiz avec son <title>, sa description
   (<meta name="description">) et ses thèmes (<meta name="themes">).
   Rien à modifier ici quand on ajoute un quiz. */
const grid = document.getElementById("grid");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = html => { grid.innerHTML = html; };

function repoFromUrl() {
  const host = location.hostname;                 // ex. goldar.github.io
  if (!host.endsWith(".github.io")) return null;
  const owner = host.split(".")[0];
  const first = location.pathname.split("/").filter(Boolean)[0];
  // Site de projet : /nom-du-depot/…  ·  site perso : dépôt « owner.github.io »
  const repo = first && !first.endsWith(".html") ? first : host;
  return { owner, repo };
}

async function listFiles(owner, repo) {
  const key = "quizlist:" + owner + "/" + repo;
  try { const c = JSON.parse(sessionStorage.getItem(key)); if (c && Date.now() - c.t < 5 * 60e3) return c.files; } catch (e) {}
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/`);
  if (!r.ok) throw new Error("GitHub " + r.status);
  const files = (await r.json())
    .filter(f => f.type === "file" && /\.html?$/i.test(f.name) && !/^index\.html?$/i.test(f.name))
    .map(f => f.name)
    .sort((a, b) => a.localeCompare(b, "fr", { numeric: true }));
  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), files })); } catch (e) {}
  return files;
}

async function readInfo(name) {
  const fallback = { name, title: name.replace(/^\d+[_-]?/, "").replace(/\.html?$/i, "").replace(/[_-]+/g, " "), desc: "", themes: [] };
  try {
    const r = await fetch(encodeURI(name));
    if (!r.ok) return fallback;
    const doc = new DOMParser().parseFromString(await r.text(), "text/html");
    const meta = n => doc.querySelector(`meta[name="${n}"]`)?.getAttribute("content") || "";
    return {
      name,
      title: doc.querySelector("title")?.textContent.trim() || fallback.title,
      desc: meta("description"),
      themes: meta("themes").split(",").map(s => s.trim()).filter(Boolean)
    };
  } catch (e) { return fallback; }
}

(async () => {
  const where = repoFromUrl();
  if (!where) {
    show(`<p class="msg">La liste des quiz s'affiche une fois la page en ligne sur GitHub Pages.</p>`);
    return;
  }
  try {
    const files = await listFiles(where.owner, where.repo);
    if (!files.length) { show(`<p class="msg">Aucun quiz pour l'instant.</p>`); return; }
    const infos = await Promise.all(files.map(readInfo));
    show(infos.map(q => `<a class="card" href="${esc(encodeURI(q.name))}">
      <h2>${esc(q.title)}</h2>${q.desc ? `<p>${esc(q.desc)}</p>` : `<p></p>`}
      ${q.themes.length ? `<div class="chips">${q.themes.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
    </a>`).join(""));
  } catch (e) {
    show(`<p class="msg">Impossible de charger la liste des quiz pour le moment. Réessaie dans quelques minutes.</p>`);
  }
})();
</script>
</body>
</html>
